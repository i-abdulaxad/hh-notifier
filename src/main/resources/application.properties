spring.application.name=hh-notifier

# Secrets (bot token, chat id) live in ./secrets.properties, which is gitignored.
spring.config.import=optional:file:./secrets.properties

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# area 97 = Uzbekistan, 2759 = Tashkent
hh.area=97
hh.keywords[0].label=Java
hh.keywords[0].query=java
hh.keywords[0].topic-id=2
hh.keywords[1].label=Golang
# "go" alone also matches things like "GO TAXI", so require a developer word next to it
hh.keywords[1].query=golang OR (go AND (developer OR разработчик OR backend OR engineer OR дастурчи OR программист OR инженер))
hh.keywords[1].topic-id=3
hh.experiences=between1And3,between3And6
hh.poll-interval=5m
hh.seen-file=data/seen-vacancies.txt
# On the very first run, also post vacancies that already exist (otherwise they are only remembered).
hh.send-existing-on-first-run=false
# Keep editing posted messages with fresh viewer/applicant counts for this long after posting.
hh.posted-file=data/posted-messages.json
hh.refresh-interval=30m
hh.refresh-window=24h
# true = do a single poll + refresh and exit (for cron-style hosting such as GitHub Actions)
hh.run-once=false
