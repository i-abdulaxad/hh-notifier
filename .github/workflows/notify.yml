name: hh-notifier

on:
  schedule:
    # GitHub's minimum is every 5 minutes; under load runs can start a few minutes late
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # to commit data/ (what was already posted) back to the repo

concurrency:
  group: hh-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: ./gradlew --no-daemon -q bootJar -x test

      - name: Check hh and post new vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: java -Xmx256m -jar build/libs/hh-notifier-0.0.1-SNAPSHOT.jar --hh.run-once=true

      - name: Save state
        if: always()
        run: |
          git config user.name "hh-notifier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update notifier state [skip ci]"
          git pull -q --rebase && git push -q
